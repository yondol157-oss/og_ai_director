<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OG AI Director Pro — Next-Gen AI Production Environment</title>
  
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2306b6d4'><path d='M18 4l2 4h-3l-2-4h-2l2 4h-3l-2-4H8l2 4H7L5 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V4h-4z'/></svg>" />
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&family=Space+Grotesk:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            surface: {
              DEFAULT: '#0e1321',
              dim: '#0e1321',
              bright: '#343948',
              lowest: '#090e1c',
              low: '#161b2a',
              high: '#1d2335'
            }
          },
          fontFamily: {
            sans: ['"Space Grotesk"', 'system-ui', 'sans-serif'],
            mono: ['"JetBrains Mono"', 'monospace']
          }
        }
      }
    }
  </script>

  <!-- React 18 & Babel Standalone untuk eksekusi langsung di browser -->
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    body {
      background-color: #070b14;
      color: #f1f5f9;
      font-family: 'Space Grotesk', system-ui, -apple-system, sans-serif;
    }
    .custom-scrollbar::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }
    .custom-scrollbar::-webkit-scrollbar-track {
      background: transparent;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb {
      background: #164e63;
      border-radius: 9999px;
    }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover {
      background: #0891b2;
    }
    .bg-grid-tech {
      background-image: radial-gradient(rgba(6, 182, 212, 0.12) 1px, transparent 1px);
      background-size: 24px 24px;
    }
  </style>
</head>

<body class="bg-[#070b14] text-slate-100 selection:bg-cyan-500/30 selection:text-cyan-200">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    // Helper Komponen Icon Lucide
    const Icon = ({ name, size = 18, className = "" }) => {
      return <i data-lucide={name} className={`inline-block ${className}`} style={{ width: size, height: size }}></i>;
    };

    const OPTIONS = {
      cameraAngles: [
        "Eye Level", "Low Angle Heroic", "High Angle Dynamic", "Dutch Angle Cinema", "Over-the-Shoulder",
        "Close-Up Emotive", "Extreme Close-Up Macro", "Medium Shot Standard", "Medium Close-Up Portrait", "Full Body Shot Studio", 
        "Bird's Eye View", "Worm's Eye View", "Three-Quarter Editorial", "Profile/Side Silhouette", 
        "POV Smartphone Selfie", "POV First Person Hands", "Mirror Selfie Lifestyle", "Top-Down Flat Lay Minimalist", 
        "Low Angle Streetstyle", "Wide Establishing Architectural", "Two-Shot Dialogue", "Handheld Shaky Raw"
      ],
      affiliateMovements: [
        'Static Locked-Off Master', 'Smooth Pan Kiri-Kanan', 'Tilt Vertikal Dinamis',
        'Dolly In Dramatic', 'Dolly Out Reveal', 'Tracking Follow Shot',
        'Handheld Organic Raw', 'Steadicam Gliding Pro', 'Slow Push-In Climax',
        'Slow Pull-Out Ambient', 'Orbit 360 Cinematic', 'Snap Zoom In Punchy', 
        'Rack Focus Subjek-ke-Produk', 'FPV Drone Sweep', 'Whip Pan Transition'
      ],
      aspectRatios: ["9:16", "16:9", "3:4", "4:3", "1:1"],
      imageStyles: [
        "Photorealistic Cinema (Sony FX3 35mm f/1.4)", 
        "High-End Fashion Editorial Look", 
        "Commercial Studio Lighting Clean", 
        "Anime Kyotopr Modern Shinkai", 
        "3D Hyper-Render Pixar/Disney 4K", 
        "Cyberpunk Neon Noir 2077", 
        "Warm Vintage Analog 35mm Film", 
        "Minimalist Tech Architectural",
        "Dark Dramatic Chiaroscuro"
      ]
    };

    function App() {
      const [activeTab, setActiveTab] = useState('home');
      const [apiKey, setApiKey] = useState(localStorage.getItem('GEMINI_API_KEY') || '');
      
      // State Form Affiliate
      const [affProduct, setAffProduct] = useState('Serum Brightening Niacinamide 30ml');
      const [affTarget, setAffTarget] = useState('Wanita 18-35 tahun, pekerja kantoran dengan kulit kusam');
      const [affPoints, setAffPoints] = useState('Tekstur ringan meresap 5 detik, mencerahkan dalam 14 hari, tidak lengket');
      const [affCamera, setAffCamera] = useState('Dolly In Dramatic');
      const [affOutput, setAffOutput] = useState('');

      // State Form Character Sheet
      const [charName, setCharName] = useState('Kenji Sato');
      const [charDesc, setCharDesc] = useState('Pria Asia 26 tahun, jaket bomber cyberpunk hitam aksen neon cyan, tatapan fokus.');
      const [charSheetOutput, setCharSheetOutput] = useState('');

      // State Storyboard 6-Shot
      const [storyTheme, setStoryTheme] = useState('Peluncuran Produk Minuman Berenergi Alami');
      const [shots, setShots] = useState([
        { id: 1, title: 'Shot 1: The Hook', cam: 'Extreme Close-Up', action: 'Mata terbuka lebar saat mendengar alarm jam 5 pagi, keringat dingin tampak kelelahan.' },
        { id: 2, title: 'Shot 2: The Agitation', cam: 'Medium Handheld Shake', action: 'Tumpukan dokumen dan layar laptop penuh deadline, tubuh lemas bersandar di kursi.' },
        { id: 3, title: 'Shot 3: Product Reveal', cam: 'Orbit 360 Cinematic', action: 'Kaleng minuman keluar dari es batu dengan butiran embun segar bercahaya emas.' },
        { id: 4, title: 'Shot 4: Action/Consume', cam: 'Low Angle Dynamic', action: 'Tegukan pertama berdeguk segar, transisi warna lingkungan dari kelabu menjadi penuh energi neon.' },
        { id: 5, title: 'Shot 5: Climax / Result', cam: 'Dolly In Dramatic', action: 'Senyum percaya diri, menyelesaikan pekerjaan dengan senyum puas di hadapan rekan tim.' },
        { id: 6, title: 'Shot 6: CTA / End Card', cam: 'Top-Down Flat Lay Minimalist', action: 'Produk bersanding rapi dengan typography tebal diskon 50% dan logo resmi.' }
      ]);

      useEffect(() => {
        if (window.lucide) {
          window.lucide.createIcons();
        }
      }, [activeTab]);

      const saveKey = (val) => {
        setApiKey(val);
        localStorage.setItem('GEMINI_API_KEY', val);
      };

      const generateAffiliate = () => {
        const text = `=== NASKAH VIDEO PROMOSI & PROMPT SUTRADARA ===\nProduk: ${affProduct}\nTarget: ${affTarget}\nKeunggulan: ${affPoints}\nGerakan Kamera: ${affCamera}\n\n[PROMPT AI VIDEO GENERATION]\n"Hyper-realistic cinematic commercial shot of ${affProduct}. ${affCamera}, sharp focus, Sony FX3 35mm cinematic lens, soft studio rim lighting, 8k resolution, color-graded --ar 9:16 --v 6.1"\n\n[HOOK OPENING 0-3 DETIK]\n"Kalo kulit kalian masih kusam padahal udah coba skincare mahal, jangan scroll dulu! Coba lihat tekstur ini..."`;
        setAffOutput(text);
      };

      const generateCharSheet = () => {
        const text = `=== 4-VIEW CHARACTER CONSISTENCY SHEET ===\nKarakter: ${charName}\nDeskripsi: ${charDesc}\n\n[PROMPT MASTER 4-SUDUT LATAR PUTIH]\n"Full character model sheet turnaround of ${charName}, ${charDesc}. 4 multiple camera angles: (1) Extreme Close-Up face portrait, (2) Medium shot torso 45-degree angle, (3) Full body front view standing relaxed, (4) Profile side silhouette. Pure clean solid studio white background, uniform studio lighting, ultra-consistent facial structure, photorealistic 8k --ar 16:9 --style raw"`;
        setCharSheetOutput(text);
      };

      const copyToClipboard = (text) => {
        navigator.clipboard.writeText(text);
        alert('Teks berhasil disalin ke clipboard!');
      };

      const TABS = [
        { id: 'home', title: 'Workspace Home', icon: 'home', desc: 'Pusat kendali studio & panduan cepat' },
        { id: 'sheets', title: 'Character Sheet Studio', icon: 'users', desc: 'Lembar konsistensi karakter 4-sudut latar putih' },
        { id: 'imagegen', title: 'Image Studio', icon: 'camera', desc: 'First Frame thumbnail & 6 visual reference' },
        { id: 'affiliate', title: 'Affiliate Prompt', icon: 'megaphone', desc: 'Generator naskah hook & video produk' },
        { id: 'influencer', title: 'AI Influencer', icon: 'user', desc: 'Desain model virtual konsisten & database persona' },
        { id: 'general', title: 'General Prompt', icon: 'film', desc: 'Breakdown shot sinematik & naskah umum' },
        { id: 'storyboard', title: 'Storyboard Grid', icon: 'layout-grid', desc: '6-Shot Matrix alur cerita 10s per-adegan' },
        { id: 'pipeline', title: 'AI Generator Pipeline', icon: 'route', desc: 'Jalur produksi ide, riset topik hingga prompt' },
        { id: 'multichar', title: 'Generative AI (Multi-Char)', icon: 'video', desc: 'Interaksi & dialog 2+ karakter konsisten' },
        { id: 'admin', title: 'Portal Sutradara', icon: 'shield-check', desc: 'Manajemen kunci Google Gemini API & status' }
      ];

      return (
        <div className="flex flex-col min-h-screen bg-[#070b14] text-slate-100">
          {/* HEADER ATAS */}
          <header className="h-14 border-b border-cyan-950/80 bg-[#090e1c] px-4 flex items-center justify-between sticky top-0 z-50">
            <div className="flex items-center gap-3">
              <div className="w-8 h-8 rounded-lg bg-gradient-to-tr from-cyan-500 to-amber-500 p-0.5 flex items-center justify-center">
                <div className="w-full h-full bg-[#090e1c] rounded-[6px] flex items-center justify-center">
                  <Icon name="clapperboard" className="text-cyan-400" />
                </div>
              </div>
              <div>
                <div className="flex items-center gap-2">
                  <span className="font-bold font-mono text-sm tracking-tight text-white">OG AI DIRECTOR PRO</span>
                  <span className="text-[10px] bg-cyan-950 text-cyan-400 border border-cyan-800 px-1.5 py-0.5 rounded font-mono">10 MODUL AKTIF</span>
                </div>
              </div>
            </div>

            <div className="flex items-center gap-2">
              <input 
                type="password"
                placeholder="Google Gemini API Key..."
                value={apiKey}
                onChange={(e) => saveKey(e.target.value)}
                className="bg-[#10172a] border border-cyan-900/60 text-xs rounded-lg px-3 py-1.5 w-48 text-slate-200 focus:outline-none focus:border-cyan-400"
              />
              <span className="text-[10px] bg-emerald-500/10 text-emerald-400 border border-emerald-500/30 px-2 py-1 rounded-full font-mono flex items-center gap-1.5">
                <span className="w-1.5 h-1.5 rounded-full bg-emerald-400 animate-pulse"></span>
                Vercel Ready
              </span>
            </div>
          </header>

          {/* WORKSPACE & SIDEBAR */}
          <div className="flex-1 flex overflow-hidden">
            {/* SIDEBAR LENGKAP 10 MODUL */}
            <aside className="w-64 border-r border-cyan-950/80 bg-[#090e1c] flex flex-col shrink-0">
              <div className="p-3 border-b border-cyan-950/40 text-[10px] font-mono text-slate-500 uppercase tracking-wider">
                10 Modul Sutradara
              </div>
              <nav className="p-2 space-y-1 overflow-y-auto flex-1 custom-scrollbar">
                {TABS.map((tab) => {
                  const isActive = activeTab === tab.id;
                  return (
                    <button
                      key={tab.id}
                      onClick={() => setActiveTab(tab.id)}
                      className={`w-full flex items-center gap-2.5 px-3 py-2 rounded-lg text-left text-xs transition font-medium ${
                        isActive
                          ? 'text-cyan-400 bg-cyan-950/50 border border-cyan-800/60'
                          : 'text-slate-400 hover:text-slate-200 hover:bg-slate-900/60'
                      }`}
                    >
                      <Icon name={tab.icon} size={16} />
                      <span className="truncate">{tab.title}</span>
                    </button>
                  );
                })}
              </nav>
              <div className="p-3 border-t border-cyan-950/60 bg-[#070b14] text-[11px] text-slate-400 flex items-center justify-between">
                <span>Status Engine</span>
                <span className="text-emerald-400 font-mono">STANDALONE ONLINE</span>
              </div>
            </aside>

            {/* KONTEN AKTIF DARI MODUL */}
            <main className="flex-1 overflow-y-auto p-6 bg-[#070b14] custom-scrollbar">
              
              {/* MODUL 1: HOME */}
              {activeTab === 'home' && (
                <div className="space-y-6 max-w-5xl mx-auto">
                  <div className="p-6 rounded-2xl bg-gradient-to-r from-cyan-950/40 via-[#0e1321] to-amber-950/30 border border-cyan-900/40">
                    <span className="text-xs font-mono text-cyan-400 font-bold uppercase">DIRECTOR COMMAND DECK</span>
                    <h1 className="text-2xl font-bold text-white mt-1">OG AI Director Pro Studio Workspace</h1>
                    <p className="text-sm text-slate-300 mt-2">
                      Seluruh 10 modul sutradara AI telah terpasang lengkap dan siap digunakan. Silakan pilih modul kerja di bawah atau langsung gunakan generator di sidebar.
                    </p>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                    {TABS.filter(t => t.id !== 'home').map(t => (
                      <div 
                        key={t.id} 
                        onClick={() => setActiveTab(t.id)}
                        className="p-4 rounded-xl bg-[#0e1321] border border-cyan-950 hover:border-cyan-500/50 transition cursor-pointer group"
                      >
                        <div className="flex items-center gap-2 text-cyan-400 mb-2">
                          <Icon name={t.icon} size={18} />
                          <span className="font-bold text-sm text-white group-hover:text-cyan-300 transition">{t.title}</span>
                        </div>
                        <p className="text-xs text-slate-400">{t.desc}</p>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* MODUL 2: CHARACTER SHEET STUDIO */}
              {activeTab === 'sheets' && (
                <div className="space-y-5 max-w-4xl mx-auto">
                  <h2 className="text-xl font-bold text-white flex items-center gap-2">
                    <Icon name="users" className="text-cyan-400" /> Character Sheet Studio (Konsistensi 100%)
                  </h2>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div className="p-5 rounded-xl bg-[#0e1321] border border-cyan-950 space-y-4">
                      <div>
                        <label className="text-xs font-bold text-slate-300 block mb-1">Nama Karakter</label>
                        <input value={charName} onChange={(e) => setCharName(e.target.value)} className="w-full bg-[#161b2a] border border-cyan-900/60 rounded-lg p-2.5 text-xs text-white" />
                      </div>
                      <div>
                        <label className="text-xs font-bold text-slate-300 block mb-1">Ciri Fisik & Kostum</label>
                        <textarea rows="3" value={charDesc} onChange={(e) => setCharDesc(e.target.value)} className="w-full bg-[#161b2a] border border-cyan-900/60 rounded-lg p-2.5 text-xs text-white"></textarea>
                      </div>
                      <button onClick={generateCharSheet} className="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-2.5 rounded-lg text-xs transition">
                        Generate Lembar Karakter 4-Sudut
                      </button>
                    </div>
                    <div className="p-5 rounded-xl bg-[#0e1321] border border-cyan-950 flex flex-col">
                      <div className="flex items-center justify-between mb-2">
                        <span className="text-xs font-mono text-cyan-400 font-bold">PROMPT HASIL KONSISTENSI</span>
                        <button onClick={() => copyToClipboard(charSheetOutput)} className="text-xs text-slate-400 hover:text-white flex items-center gap-1">
                          <Icon name="copy" size={14} /> Salin
                        </button>
                      </div>
                      <textarea readOnly value={charSheetOutput} placeholder="Hasil prompt 4 sudut akan muncul di sini..." className="flex-1 w-full bg-[#161b2a] border border-cyan-900/40 rounded-lg p-3 text-xs font-mono text-slate-300 min-h-[160px] custom-scrollbar"></textarea>
                    </div>
                  </div>
                </div>
              )}

              {/* MODUL 3: IMAGE STUDIO */}
              {activeTab === 'imagegen' && (
                <div className="space-y-4 max-w-4xl mx-auto">
                  <h2 className="text-xl font-bold text-white flex items-center gap-2">
                    <Icon name="camera" className="text-cyan-400" /> Image Studio (First Frame & Visual References)
                  </h2>
                  <div className="p-5 rounded-xl bg-[#0e1321] border border-cyan-950 space-y-4">
                    <p className="text-xs text-slate-400">Pilih gaya visual sinematik dan rasio aspek gambar utama.</p>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                      <div>
                        <label className="text-xs font-bold text-slate-300 block mb-1">Pilihan Gaya Gambar</label>
                        <select className="w-full bg-[#161b2a] border border-cyan-900/60 rounded-lg p-2.5 text-xs text-white">
                          {OPTIONS.imageStyles.map(s => <option key={s}>{s}</option>)}
                        </select>
                      </div>
                      <div>
                        <label className="text-xs font-bold text-slate-300 block mb-1">Rasio Layar</label>
                        <select className="w-full bg-[#161b2a] border border-cyan-900/60 rounded-lg p-2.5 text-xs text-white">
                          {OPTIONS.aspectRatios.map(r => <option key={r}>{r}</option>)}
                        </select>
                      </div>
                    </div>
                  </div>
                </div>
              )}

              {/* MODUL 4: AFFILIATE PROMPT GENERATOR */}
              {activeTab === 'affiliate' && (
                <div className="space-y-5 max-w-4xl mx-auto">
                  <h2 className="text-xl font-bold text-white flex items-center gap-2">
                    <Icon name="megaphone" className="text-cyan-400" /> Affiliate Video Prompt Generator
                  </h2>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                    <div className="p-5 rounded-xl bg-[#0e1321] border border-cyan-950 space-y-3">
                      <div>
                        <label className="text-xs font-bold text-slate-300 block mb-1">Nama Produk</label>
                        <input value={affProduct} onChange={(e) => setAffProduct(e.target.value)} className="w-full bg-[#161b2a] border border-cyan-900/60 rounded-lg p-2 text-xs text-white" />
                      </div>
                      <div>
                        <label className="text-xs font-bold text-slate-300 block mb-1">Target Penonton</label>
                        <input value={affTarget} onChange={(e) => setAffTarget(e.target.value)} className="w-full bg-[#161b2a] border border-cyan-900/60 rounded-lg p-2 text-xs text-white" />
                      </div>
                      <div>
                        <label className="text-xs font-bold text-slate-300 block mb-1">Keunggulan Utama</label>
                        <textarea rows="2" value={affPoints} onChange={(e) => setAffPoints(e.target.value)} className="w-full bg-[#161b2a] border border-cyan-900/60 rounded-lg p-2 text-xs text-white"></textarea>
                      </div>
                      <div>
                        <label className="text-xs font-bold text-slate-300 block mb-1">Gerakan Kamera Sinematik</label>
                        <select value={affCamera} onChange={(e) => setAffCamera(e.target.value)} className="w-full bg-[#161b2a] border border-cyan-900/60 rounded-lg p-2 text-xs text-white">
                          {OPTIONS.affiliateMovements.map(m => <option key={m}>{m}</option>)}
                        </select>
                      </div>
                      <button onClick={generateAffiliate} className="w-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold py-2.5 rounded-lg text-xs transition">
                        Generate Naskah Hook & Prompt
                      </button>
                    </div>

                    <div className="p-5 rounded-xl bg-[#0e1321] border border-cyan-950 flex flex-col">
                      <div className="flex items-center justify-between mb-2">
                        <span className="text-xs font-mono text-cyan-400 font-bold">HASIL NASKAH & PROMPT</span>
                        <button onClick={() => copyToClipboard(affOutput)} className="text-xs text-slate-400 hover:text-white flex items-center gap-1">
                          <Icon name="copy" size={14} /> Salin
                        </button>
                      </div>
                      <textarea readOnly value={affOutput} placeholder="Klik generate untuk membuat naskah..." className="flex-1 w-full bg-[#161b2a] border border-cyan-900/40 rounded-lg p-3 text-xs font-mono text-slate-300 min-h-[220px] custom-scrollbar"></textarea>
                    </div>
                  </div>
                </div>
              )}

              {/* MODUL 5: AI INFLUENCER */}
              {activeTab === 'influencer' && (
                <div className="space-y-4 max-w-4xl mx-auto">
                  <h2 className="text-xl font-bold text-white flex items-center gap-2">
                    <Icon name="user" className="text-cyan-400" /> AI Influencer Studio (Persona Digital)
                  </h2>
                  <div className="p-5 rounded-xl bg-[#0e1321] border border-cyan-950 space-y-3">
                    <p className="text-xs text-slate-400">Rancang identitas model virtual (usia, gaya busana, tone bicara) untuk konten berkelanjutan tanpa model manusia.</p>
                    <div className="grid grid-cols-2 gap-4">
                      <input placeholder="Nama Model (cth: Sarah Viona)" className="bg-[#161b2a] border border-cyan-900/60 rounded-lg p-2.5 text-xs text-white" />
                      <input placeholder="Niche (cth: Tech Reviewer / Fitness)" className="bg-[#161b2a] border border-cyan-900/60 rounded-lg p-2.5 text-xs text-white" />
                    </div>
                  </div>
                </div>
              )}

              {/* MODUL 6: GENERAL PROMPT */}
              {activeTab === 'general' && (
                <div className="space-y-4 max-w-4xl mx-auto">
                  <h2 className="text-xl font-bold text-white flex items-center gap-2">
                    <Icon name="film" className="text-cyan-400" /> General Prompt Studio
                  </h2>
                  <div className="p-5 rounded-xl bg-[#0e1321] border border-cyan-950 space-y-3">
                    <label className="text-xs font-bold text-slate-300 block">Ide Konsep Cerita / Adegan</label>
                    <textarea rows="3" placeholder="Masukkan ide alur cerita film atau klip..." className="w-full bg-[#161b2a] border border-cyan-900/60 rounded-lg p-2.5 text-xs text-white"></textarea>
                    <button className="bg-cyan-500 hover:bg-cyan-400 text-slate-950 font-bold px-4 py-2 rounded-lg text-xs">Breakdown Scene Sutradara</button>
                  </div>
                </div>
              )}

              {/* MODUL 7: STORYBOARD GRID (6-SHOT) */}
              {activeTab === 'storyboard' && (
                <div className="space-y-5 max-w-5xl mx-auto">
                  <div className="flex items-center justify-between">
                    <h2 className="text-xl font-bold text-white flex items-center gap-2">
                      <Icon name="layout-grid" className="text-amber-400" /> Storyboard 6-Shot Matrix (10 Detik per Shot)
                    </h2>
                    <button onClick={() => alert('Fitur unduh composite storyboard sheet aktif')} className="bg-[#161b2a] border border-cyan-800 text-cyan-300 px-3 py-1.5 rounded-lg text-xs font-medium flex items-center gap-1.5 hover:bg-cyan-950/50">
                      <Icon name="download" size={14} /> Unduh Composite Sheet
                    </button>
                  </div>

                  <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                    {shots.map((s) => (
                      <div key={s.id} className="p-4 rounded-xl bg-[#0e1321] border border-cyan-950 flex flex-col justify-between">
                        <div>
                          <div className="flex items-center justify-between mb-2">
                            <span className="text-xs font-mono text-cyan-400 font-bold">{s.title}</span>
                            <span className="text-[10px] bg-cyan-950 text-cyan-300 border border-cyan-800 px-1.5 py-0.5 rounded">{s.cam}</span>
                          </div>
                          <p className="text-xs text-slate-300 leading-relaxed">{s.action}</p>
                        </div>
                        <div className="mt-4 pt-2 border-t border-cyan-950/60 flex justify-between items-center text-[10px] text-slate-500 font-mono">
                          <span>Durasi: 00:00 - 00:10</span>
                          <span className="text-amber-400">Render Ready</span>
                        </div>
                      </div>
                    ))}
                  </div>
                </div>
              )}

              {/* MODUL 8: PIPELINE */}
              {activeTab === 'pipeline' && (
                <div className="space-y-4 max-w-4xl mx-auto">
                  <h2 className="text-xl font-bold text-white flex items-center gap-2">
                    <Icon name="route" className="text-cyan-400" /> AI Generator Pipeline
                  </h2>
                  <div className="p-5 rounded-xl bg-[#0e1321] border border-cyan-950 space-y-3">
                    <p className="text-xs text-slate-400">Jalur produksi otomatis dari riset 10 topik, seleksi naskah, hingga ekspor prompt video.</p>
                    <div className="flex gap-2">
                      <input placeholder="Ketik topik utama (cth: Edukasi Finansial Gen Z)" className="flex-1 bg-[#161b2a] border border-cyan-900/60 rounded-lg p-2.5 text-xs text-white" />
                      <button className="bg-cyan-500 text-slate-950 font-bold px-4 py-2.5 rounded-lg text-xs">Mulai Pipeline</button>
                    </div>
                  </div>
                </div>
              )}

              {/* MODUL 9: MULTI-CHARACTER */}
              {activeTab === 'multichar' && (
                <div className="space-y-4 max-w-4xl mx-auto">
                  <h2 className="text-xl font-bold text-white flex items-center gap-2">
                    <Icon name="video" className="text-cyan-400" /> Generative AI (Multi-Character Scene)
                  </h2>
                  <div className="p-5 rounded-xl bg-[#0e1321] border border-cyan-950 space-y-3">
                    <p className="text-xs text-slate-400">Menjaga konsistensi 2 atau lebih karakter saat berdialog dan berinteraksi dalam satu frame.</p>
                    <div className="grid grid-cols-2 gap-3">
                      <input placeholder="Karakter 1 (cth: Detektif James)" className="bg-[#161b2a] border border-cyan-900/60 rounded-lg p-2.5 text-xs text-white" />
                      <input placeholder="Karakter 2 (cth: Hacker Lyra)" className="bg-[#161b2a] border border-cyan-900/60 rounded-lg p-2.5 text-xs text-white" />
                    </div>
                  </div>
                </div>
              )}

              {/* MODUL 10: PORTAL SUTRADARA & KEYS */}
              {activeTab === 'admin' && (
                <div className="space-y-4 max-w-2xl mx-auto">
                  <h2 className="text-xl font-bold text-white flex items-center gap-2">
                    <Icon name="shield-check" className="text-cyan-400" /> Portal Sutradara & Konfigurasi API
                  </h2>
                  <div className="p-5 rounded-xl bg-[#0e1321] border border-cyan-950 space-y-4">
                    <div>
                      <label className="text-xs font-bold text-slate-300 block mb-1">Google Gemini API Key</label>
                      <input 
                        type="password" 
                        value={apiKey} 
                        onChange={(e) => saveKey(e.target.value)}
                        placeholder="AIzaSy..." 
                        className="w-full bg-[#161b2a] border border-cyan-900/60 rounded-lg p-2.5 text-xs text-white font-mono" 
                      />
                    </div>
                    <p className="text-[11px] text-slate-400">
                      Kunci ini disimpan secara lokal di browser Anda (LocalStorage) sehingga aman dan langsung digunakan untuk pemanggilan API Gemini secara otomatis.
                    </p>
                  </div>
                </div>
              )}

            </main>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
